# Test-only override, applied by test/setup.js on top of compose.yml.
#
# CW_BACKEND_URL/CW_BACKEND_TOKEN are deliberately absent from compose.gas.yml:
# they are `Joi.string().uri().optional()` in src/common/config.js, so an empty
# interpolated value would fail validation and stop the service booting for
# anyone running `docker compose up` without them. Here the integration harness
# always supplies both, pointing GAS at the in-process CW actuator stub
# (test/helpers/cw-stub.js) on the host.
#
# LAND_DATA_URL carries credentials and a query, and LAND_DATA_HEADERS a
# secret, so the admin Agreement tab can be shown to answer neither.
#
# SERVICE_ACCESS_TOKEN_HASH is what an environment still holding the old
# seeding secret boots with; GAS must write nothing from it.
#
# CW_BACKEND_TIMEOUT_MS is shortened from the 4 s default so each "CW times
# out" case costs a fraction of a second rather than the whole test timeout.
services:
  gas:
    environment:
      CW_BACKEND_URL: "${CW_BACKEND_URL}"
      CW_BACKEND_TOKEN: "${CW_BACKEND_TOKEN}"
      HTTP_CLIENT_TIMEOUT_MS: "${HTTP_CLIENT_TIMEOUT_MS}"
      CW_BACKEND_TIMEOUT_MS: "${CW_BACKEND_TIMEOUT_MS}"
      SERVICE_ACCESS_TOKEN_HASH: "it-boot-seed:b007b007b007b007b007b007b007b007b007b007b007b007b007b007b007b007"
      LAND_DATA_URL: "https://u:p@land-data.test/base/?k=v"
      LAND_DATA_HEADERS: "Authorization:secret"
