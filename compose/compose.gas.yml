services:
  gas:
    build: .
    networks:
      - cdp-tenant
    ports:
      - "${GAS_PORT:-3102}:3102"
    env_file:
      - .env
    environment:
      PORT: 3102
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=mongoRepl
      AWS_ENDPOINT_URL: "http://floci:4566"
      # Container URLs, the same as the rest of the stack uses. The SDK sends
      # every request to AWS_ENDPOINT_URL, so only the queue name in the path
      # is actually used.
      GAS__SQS__CONFIG_VERSION_QUEUE_URL: "http://floci:4566/000000000000/gas__sqs__config_version_updated"
      OUTBOX_POLL_MS: "${OUTBOX_POLL_MS}"
      INBOX_POLL_MS: "${INBOX_POLL_MS}"
      GRANT_FUNDING_CALCULATOR_URL: "${GRANT_FUNDING_CALCULATOR_URL}"
      VIEW_AGREEMENT_URI: "${VIEW_AGREEMENT_URI}"
      LEGACY_AGREEMENT_GRANT_CODES: "${LEGACY_AGREEMENT_GRANT_CODES}"
      # FGP-1307: caller-token enforcement. Defaults to on (secure) for local
      # `docker compose up`; the integration test harness passes "false" so the
      # header-driven authz scenarios keep working during the staged rollout.
      CALLER_TOKEN_ENFORCE: "${CALLER_TOKEN_ENFORCE:-false}"
      # FGP-1411: QA-only test endpoints. Off unless explicitly enabled, so a
      # plain `docker compose up` never exposes them; the integration test
      # harness passes "true" to exercise the routes.
      ENABLE_TEST_ENDPOINTS: "${ENABLE_TEST_ENDPOINTS:-false}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3102/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      mongo-ready:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      floci:
        condition: service_healthy
    develop:
      watch:
        - path: ./src
          target: /home/node/src
          action: sync+restart
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./migrate-mongo-config.js:/home/node/migrate-mongo-config.js
      - ./migrations:/home/node/migrations
      - ./package.json:/home/node/package.json
