## example compose file for pulling gas into an external service

include:
  - path: ../fg-gas-backend/compose/compose.gas.yml
    project_directory: ../fg-gas-backend

services:
  grants-ui:
    environment:
      GAS_API_URL: "http://gas:3102"
      GAS_API_AUTH_TOKEN: "<mint an auth token>"

  gas:
    networks: [grants-ui-net]

  mongo-ready:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh 'mongodb://mongodb:27017/?directConnection=true' --quiet --eval 'db.hello().isWritablePrimary' | grep -q true || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 60

  floci:
    volumes:
      # Mounted as an individual file rather than as a directory, because
      # several repos add scripts to this container and Compose merges volumes
      # by target path - two repos each mounting a *directory* at the same
      # target would silently drop one set of scripts.
      #
      # Floci pools the scripts from every init directory and runs them ordered
      # by filename. The 20- prefix sequences gas after the host stack's own
      # resources. Note 99-ready.sh is deliberately not mounted: the host stack
      # owns the /tmp/READY marker its healthcheck waits on, and a script that
      # sorts before the others must not flip it green early.
      - ../fg-gas-backend/compose/floci/start.d/10-setup-resources.sh:/etc/floci/init/ready.d/20-gas-resources.sh:ro

networks:
  cdp-tenant:
    name: grants-ui-net
    external: true
