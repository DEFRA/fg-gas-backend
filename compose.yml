include:
  - path: ./compose/compose.gas.yml
    project_directory: .

services:
  floci:
    image: floci/floci:1.5.33-compat
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    env_file:
      - "compose/aws.env"
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
      # Hostname floci puts in returned QueueUrls, so they stay reachable from
      # the host. Floci starts every service, so there is no SERVICES list.
      FLOCI_HOSTNAME: 127.0.0.1
    volumes:
      # Nothing else mounts into this container, so a directory mount is safe
      # here. When gas is pulled into another stack the scripts are mounted
      # individually instead - see compose/ext/compose.gas-ext.example.yml.
      # Floci runs them ordered by filename, so 99-ready.sh sorts last.
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
      # Seed data copied to S3 by 10-setup-resources.sh. Mounted outside
      # /etc/floci/init so the init runner never treats it as a script dir.
      - ./compose/seed:/etc/floci/seed:ro
    # The image ships a healthcheck, but it only reports that the gateway is
    # listening - which happens before the init scripts have run. Waiting on the
    # marker 99-ready.sh writes means nothing that depends on floci starts
    # before its queues and topics exist.
    healthcheck:
      test: ["CMD", "stat", "/tmp/READY"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:6.0.13
    networks:
      - cdp-tenant
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      ["mongod", "--replSet", "mongoRepl", "--bind_ip", "localhost,mongodb"]
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    restart: always

  mongo-ready:
    image: mongo:6.0.13
    networks: [cdp-tenant]
    environment:
      PRIMARY: "mongodb:27017"
      REPLSET: "mongoRepl"
    volumes:
      - ./scripts/wait-for-replicaset.sh:/wait-for-replicaset.sh:ro
    entrypoint: ["/bin/bash", "/wait-for-replicaset.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh 'mongodb://mongodb:27017/?directConnection=true' --quiet --eval 'db.hello().isWritablePrimary' | grep -q true || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  mongodb-data:
  mongodb-config:

networks:
  cdp-tenant:
    driver: bridge
