name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node version
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        run: npm run setup:env

      - name: Lint
        run: npm run lint

      - name: Check format
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:unit -- --coverage

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run integration tests
        run: |
          # Testcontainers removes a failed stack before setup's catch runs.
          # Follow Floci from its start event and keep output on the runner.
          capture_since=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
          setsid bash -c '
            docker events \
              --since "$1" \
              --filter type=container \
              --filter event=start \
              --filter event=die \
              --filter event=oom \
              --filter label=com.docker.compose.service=floci \
              --format "{{.Action}} {{.Actor.ID}} {{index .Actor.Attributes \"exitCode\"}}" |
            while read -r event container_id exit_code; do
              echo "Floci $container_id: $event exitCode=${exit_code:--}"
              if [ "$event" = start ]; then
                docker logs --follow --timestamps "$container_id" &
              fi
            done
          ' floci-log-capture "$capture_since" > "$RUNNER_TEMP/gas-floci-startup.log" 2>&1 &
          capture_pid=$!
          trap 'kill -- "-$capture_pid" 2>/dev/null || true' EXIT

          npm run test:integration:verbose

      - name: Show Floci startup logs after integration failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/gas-floci-startup.log" ]; then
            cat "$RUNNER_TEMP/gas-floci-startup.log"
          fi

      - name: Build docker image
        run: |
          set +e
          docker build --no-cache --tag fg-gas-backend .
          exit $?

  pact:
    name: Pact
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    uses: ./.github/workflows/pact-verify.yml
    with:
      publish-verification: false
